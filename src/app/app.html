<main class="page-shell">
  <app-navbar></app-navbar>

  <div class="lead-modal-backdrop" *ngIf="isLeadModalOpen" aria-modal="true" role="dialog">
    <div class="lead-modal" *ngIf="!leadSubmitted">
      <button class="lead-modal-close" type="button" (click)="closeLeadModal()" aria-label="Close enquiry form">×</button>

      <div class="lead-modal-header">
        <span class="lead-dot"></span>
        <h3>Pest Control Enquiry</h3>
      </div>

      <p class="lead-modal-subtitle">Homes, hospitals, hotels, and businesses across Pune, PCMC, Mumbai, Nashik, Raigad, and Chhatrapati Sambhajinagar</p>

      <form class="lead-form" (ngSubmit)="submitLeadForm()">
        <input type="text" [(ngModel)]="leadForm.name" name="name" placeholder="Your Name" required />
        <input type="tel" [(ngModel)]="leadForm.phone" name="phone" placeholder="Mobile Number" required />
        <input type="email" [(ngModel)]="leadForm.email" name="email" placeholder="Email Address" required />

        <select [(ngModel)]="leadForm.service" name="service" required>
          <option value="" disabled selected>Select Service</option>
          <option value="termite">Termite Control</option>
          <option value="cockroach">Cockroach Control</option>
          <option value="rodent">Rodent Control</option>
          <option value="mosquito">Mosquito Control</option>
          <option value="general">General Pest Control</option>
        </select>

        <input type="text" [(ngModel)]="leadForm.location" name="location" placeholder="Your Location (Area)" required />

        <button class="lead-submit" type="submit" [disabled]="isLeadSubmitting">
          {{ isLeadSubmitting ? 'Sending...' : 'Submit Enquiry' }}
        </button>
        <p class="lead-error" *ngIf="leadError">{{ leadError }}</p>
      </form>
    </div>

    <div class="lead-modal lead-success" *ngIf="leadSubmitted">
      <div class="lead-success-icon">✓</div>
      <h3>Enquiry submitted</h3>
      <p>Thank you. Our team will contact you shortly.</p>
    </div>
  </div>

  <div class="page-content" [class.route-page]="!isHomeRoute" role="main">
    <router-outlet></router-outlet>
  </div>

  <app-footer></app-footer>

  <a class="whatsapp-float" href="https://wa.me/918446104688" target="_blank" rel="noreferrer" aria-label="WhatsApp chat">
    <img src="https://cdn.simpleicons.org/whatsapp/ffffff" alt="" aria-hidden="true" />
  </a>

  <a class="call-float" href="tel:+918446104688" aria-label="Call KATX">
    <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/phone-call.svg" alt="" aria-hidden="true" />
  </a>

  <button class="scroll-top" type="button" (click)="scrollToTop()" aria-label="Scroll to top">↑</button>
</main>
